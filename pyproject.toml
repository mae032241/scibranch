[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scidiscovery"
version = "0.1.1"
description = "SciBranch: portable, evidence-bound scientific discovery orchestration"
readme = "README.md"
license = {file = "LICENSE"}
classifiers = ["License :: OSI Approved :: MIT License"]
requires-python = ">=3.10"
dependencies = [
  "packaging>=23,<27",
  "cryptography>=42,<47",
  "jsonschema>=4,<5",
  "pydantic>=2,<3",
  "tomli>=2; python_version < '3.11'",
]

[project.urls]
Homepage = "https://github.com/mae032241/scibranch"
Repository = "https://github.com/mae032241/scibranch"
Issues = "https://github.com/mae032241/scibranch/issues"
Changelog = "https://github.com/mae032241/scibranch/blob/main/CHANGELOG.md"

[project.optional-dependencies]
test = [
  "PyYAML>=6,<7",
  "pytest>=8,<10",
]

[project.scripts]
scid = "scidiscovery.app_cli:main"
scid-research = "scidiscovery.research_loop.cli:main"
scid-experiment = "scidiscovery.research_loop.experiments:main"

[project.entry-points."scidiscovery.execution_interfaces"]
local_execution = "scidiscovery.research_loop.local_experiments:REGISTRATION"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "--strict-markers"
pythonpath = ["src", ".", "plugins/cov_execution", "plugins/tcad_artifact"]
testpaths = ["tests"]
norecursedirs = ["portable_delivery"]
markers = [
  "installed: isolated wheel installation and installed entry points",
  "stress: large-input and resource-bound checks; run with --test-lane=stress",
  "process_e2e: launches real CLI, shell, namespace, worker or lock-contention subprocesses",
  "live_platform: requires a running Codex platform and is not part of hermetic pytest",
]
