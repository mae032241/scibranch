# Pi example; research.example.toml is the separate Codex example.
# Copy beside your exact objective/public originals, replace placeholders, then:
# scid-research config-check --config research.toml
# scid-research prepare --config research.toml
# scid-research start --root /absolute/project/research-instance
# Paths below resolve relative to this TOML. Use the exact prepared instance root.
# Edits affect new instances only; existing work keeps its frozen bindings/spend.
version = 1

[research]
root = "research-instance"
objective = "public/objective.md"
public_root = "public"
user_updates = []

[agent]
backend = "pi"
# One installed executable, no arguments; omission also defaults to ["pi"].
launcher = ["pi"]
# Replace with an actually available exact provider/model-id, not a fuzzy name.
model = "provider/exact-model-id"
# Explicit and actually supported by that model; no substitution or clamp.
reasoning_effort = "high"
# Omitted roles inherit these fields. Do not add service_tier or Codex native options.
# Keep credentials in the original native environment/home, never in this TOML.

[agent.native]
# Omission or "closed" preserves the controlled profile, including package refusal.
resource_mode = "closed"

[permissions]
# All four fields are required explicitly. Default Local requires workspace-write.
workspace = "workspace-write"
network = true
web = "disabled"
subagents = false
# PI_OFFLINE limits automatic resources/catalog fetching, not provider/bash network.
# Linux mounts are mandatory, with no unsandboxed fallback; same-user access is soft.

# To use trusted, already installed native extensions/packages, replace the existing
# agent.native and permissions tables above with these tables (do not duplicate them):
# [agent.native]
# resource_mode = "configured"
# [permissions]
# workspace = "workspace-write"
# network = true
# web = "live"
# subagents = false
# For ordinary read-only scientific work use workspace = "read-only" AND external
# executor mode below. Explicit configured mode authorizes trusted extensions;
# subagents=false requests no Backend delegation, without forbidding extension child
# calls/processes. Effective subagents is unknown (null), enforcement extension_dependent.
# Pi native subagents remain unsupported. W handles small work itself and may ask E
# for large/complex evidence. Closed must retain web="disabled", subagents=false.
# Original HOME, PI_CODING_AGENT_DIR, settings and auth are neither copied nor edited.
# Configured uses the original SDK to load cached installed packages; no automatic
# package install/refresh. Existing npm:pi-web-access, npm:pi-guard-sandbox and
# npm:pi-gauge entries may remain in the original global settings packages array.
# Only --no-extensions is removed; offline/no-approve/no-context-files/no-skills/
# no-mcp/no-prompt-templates/no-themes remain. Package Skills/prompts/themes are not
# auto-imported; framework-selected Skills retain exact selection/source checks.
# Loading errors remain native errors; command inventory is not proof every package loaded.

[budget]
max_tokens = 2000000
max_seconds = 3600
max_steps = 32
# Finite all-role node targets inherit these original ceilings when omitted.
# Targets are advisory; shared admission and finite real-execution limits still apply.

# executor omitted: host-owned Local with local_execution:command and control Python.
# Pi's scientific child has empty HOME and no native authentication/private sessions;
# no Codex binary is required. For a different scientific Python, explicitly declare:
# [executor]
# mode = "local"
# [executor.config]
# executor = "local_execution:command"
# [executor.config.configuration]
# run_argv = ["/absolute/existing/scientific-env/bin/python"]
# max_seconds = 120
# Ordinary read-only scientific work instead needs BOTH workspace = "read-only"
# above AND [executor] mode = "external". It is not tool-less auxiliary read-only.

# policies omitted: current finite Pi RPC turn-scoped output-only repair + execution
# wake, shared automatic_recovery, and same_session W cadence with max_context_windows=1.
# New automatic defaults: max_attempts=8 total retries+continues across native failures,
# work completion and format fallback (0 disables all automatic modes), each action cap=8,
# initial_backoff_seconds=5, max_backoff_seconds=300, jitter_fraction=0,
# max_wait_seconds=1800. Normal waits total 915s; provider hints remain bounded.
# Existing explicit nonempty recovery policies omitting max_attempts retain no total cap.
# Web 重试设置 updates apply to future nodes; original calls and spent budgets persist.
# Do not copy Codex resume protocol IDs or redirect Pi native home/authentication.
# Policy declarations, chat and transport success grant no review/execution approval.
# New supported closed preparations retain controlled single-native-session authorship proof.
# Configured freezes complete native authorship false; extension calls/participants
# have unknown coverage. Ordinary W/A/Final A gain no additional blocker from this.
# Opt-in shared formal A requires complete authors/reviewers, disjoint participants
# and a sealed pass for the exact subject; repair/resume stays the same author.
# Frozen false capabilities/old unsupported receipts do not gain support retroactively.
# Full native-call accounting and tool-less auxiliary read-only remain unsupported.
# The framework observer covers only the main Pi session in both profiles and keeps
# the common 90% notice / strictly above 70% handoff rules; tokens remain lower bounds.
# See docs/RESEARCH_CONFIGURATION.md for retained proof and same-user soft boundaries.
# No delivery adapter is declared; artifacts remain in the instance.

# Optional Skills: select installed live schema-v3 assets per role, not copies.
# [skills.sets.analysis]
# items = ["curve-analysis", "scientific-paper-evidence"]
# [agent.roles.W]
# skill_set = "analysis"
# Native get_commands must prove exact selected manuals loaded valid frontmatter.
# Closed refuses nonempty packages and arbitrary user extensions. Configured allows
# cached installed native packages/extensions, including extra extension commands,
# while retaining observer and selected Skill exact-source checks.
# Both profiles refuse custom npmCommand and inherited SYSTEM.md/APPEND_SYSTEM.md
# at the original agent directory and workspace .pi scope before startup.

[ui]
port = 0
open_browser = false
