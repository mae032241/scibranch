# Copy this declaration beside your objective/public inputs, then use:
# scid-research config-check --config research.toml
# scid-research prepare --config research.toml
# scid-research run --root ./research-instance
# Paths declared here are relative to this TOML. Edits affect new instances only;
# use budget-amend for an existing instance's cumulative authorization.
version = 1

[research]
root = "research-instance"
objective = "public/objective.md"
public_root = "public"
user_updates = []

[agent]
backend = "codex"
launcher = ["codex"]
model = "gpt-6.1-sol"
reasoning_effort = "high"
service_tier = "default"

# Omitted roles/fields inherit the global profile.
[agent.roles.A]
reasoning_effort = "high"

# These settings are frozen and passed to the selected backend. Native auth
# stays in the inherited original home; do not put credentials in this file.
# Protocol backends report these declarations as hints, not enforced isolation.
[permissions]
workspace = "workspace-write"
network = false
web = "disabled"
subagents = false

[budget]
max_tokens = 2000000
max_seconds = 3600
max_steps = 32
candidate_extra_slots = 2

# Search targets and node targets are soft; shared finite admission still applies.
[budget.breadth]
max_w_seconds = 900
max_w_observed_tokens = 2000000
max_requested_repairs = 2
initial_calls = 1

[budget.correction]
review_after = 3
pause_after = 2

# Optional role targets use [budget.node_targets.H], .W, .A and .E with
# max_observed_tokens and max_seconds for every role. No target raises a total.
# Standard Codex gets bounded output-only repair in its original native home;
# absent explicit node targets, each role references the original total ceilings.

[executor]
mode = "local"
# Optional [executor.config] accepts the existing executor/configuration contract.
# Its default is local_execution:command using this same Python environment.
# Execution resources still need explicit review, authority and exact-call gates.
# For task-specific Python dependencies, explicitly select the scientific Python:
# [executor.config]
# executor = "local_execution:command"
# [executor.config.configuration]
# run_argv = ["/absolute/existing/scientific-env/bin/python"]
# max_seconds = 120
# python_requirements = [
#   { requirement = "scikit-learn>=1.4,<2", import_name = "sklearn" },
# ]
# config-check/prepare check these in run_argv[0], independently of control Python.

# Optional [delivery] accepts the existing frozen delivery policy. Omitting it
# grants no external delivery adapter. Scientific artifacts remain in the instance.

[ui]
port = 0
open_browser = false
# Host-private credential source reference only; no credential bytes are copied.
# approval_secret_file = "private/operator.key"

# Framework Skills are empty by default. Uncomment explicit sets and role/Worker
# bindings to select installed bundles. Source is read-only and frozen per instance;
# a new bundle/version requires a new instance. Installation wrappers select their
# own persistent skills directory; root below overrides that default.
# [skills]
# root = "/opt/scidiscovery-thin/skills"
# [skills.sets.tcad]
# items = ["sentaurus-tcad-code"]
# [skills.sets.analysis]
# items = ["curve-analysis", "scientific-paper-evidence"]
# [agent.workers.analysis]
# model = "gpt-6.1-sol"
# reasoning_effort = "high"
# service_tier = "default"
# skill_set = "analysis"
# [agent.roles.W]
# skill_set = "tcad"
# Add worker = "analysis" to the existing [agent.roles.A] section to bind A.
