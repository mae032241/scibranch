[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scidiscovery-cov-execution"
version = "0.1.1"
description = "Cov public execution and observation adapter for SciDiscovery"
requires-python = ">=3.10"
dependencies = ["scidiscovery>=0.1.1"]

[project.entry-points."scidiscovery.execution_interfaces"]
cov_execution = "cov_execution.experiments:REGISTRATION"

[tool.setuptools.packages.find]
where = ["."]
include = ["cov_execution*"]
