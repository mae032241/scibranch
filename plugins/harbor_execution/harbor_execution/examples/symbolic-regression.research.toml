# Host template for the original TerminalScience symbolic-regression task.
# Copy to an explicit host path and edit ordinary scientific/profile settings.
# __SCID_*__ values are bound privately by the Harbor entry, never by Workers.
version = 1

[research]
root = __SCID_INSTANCE_ROOT__
objective = __SCID_OBJECTIVE__
public_root = __SCID_PUBLIC_ROOT__
user_updates = [__SCID_NAVIGATION__]

[agent]
backend = "codex"
launcher = ["codex"]
model = "gpt-6.1-sol"
reasoning_effort = "high"
service_tier = "default"
# All H/W/A/E inherit this exact profile. Native HOME/auth stay on the host.

[permissions]
workspace = "workspace-write"
network = false
web = "disabled"
subagents = false

[budget]
# Observed-token ceiling is soft for an already active native call.
max_tokens = 1000000
max_seconds = 1800
max_steps = 80

[executor.config]
executor = "harbor_execution:experiment"

[executor.config.configuration]
container_id = __SCID_CONTAINER_ID__
container_root = __SCID_CONTAINER_ROOT__
docker_argv = __SCID_DOCKER_ARGV__
python_argv = ["/usr/local/bin/python", "-B", "-u"]
environment = __SCID_CONTAINER_ENV__
user = __SCID_CONTAINER_USER__
max_seconds = 120
deadline_epoch = __SCID_DEADLINE_EPOCH__

[policies]
formal_review = true

[policies.selection]
version = 2

[ui]
port = 0
open_browser = false

[delivery]
inflight_tokens = 100000
cleanup_seconds = 15
submit_seconds = 30
confirm_seconds = 30
adapter = __SCID_DELIVERY_ADAPTER__

[delivery.closeout_a]
max_observed_tokens = 250000
max_seconds = 300
