[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tcad-artifact"
version = "0.1.1"
description = "Execution-only detached TCAD dispatcher"
requires-python = ">=3.10"
dependencies = [
  "scidiscovery>=0.1.1",
]

[project.scripts]
tcad-control-daemon = "tcad_artifact.execution_daemon:main"
scidiscovery-tcad-transport = "tcad_artifact.ssh_transport:main"

[project.entry-points."scidiscovery.execution_interfaces"]
tcad_execution = "tcad_artifact.managed_execution:REGISTRATION"

[tool.setuptools.packages.find]
where = ["."]
include = ["tcad_artifact*"]

[tool.setuptools.data-files]
"share/tcad-artifact/systemd" = ["deploy/systemd/*.in"]
"share/tcad-artifact/config" = ["config/*.json"]
